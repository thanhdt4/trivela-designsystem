<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>TriVela UI</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: docs shell like a framework reference — sticky header, left nav, article, right "on this page" rail. */
:root{
  /* site chrome */
  --page:#FFFFFF; --page-2:#F8FAFC; --ink:#0F172A; --ink-2:#334155; --ink-3:#64748B; --line:#E2E8F0; --line-2:#F1F5F9;
  --accent:#0057C4; --accent-ink:#004EB0; --accent-soft:#E6EEF9; --code-bg:#0F172A; --code-ink:#E2E8F0; --code-dim:#94A3B8; --code-key:#80ABE2; --code-str:#96E68F; --code-tag:#FCA5A5;
  --stage:#F8FAFC; --stage-dot:#E2E8F0;
  --font:"Be Vietnam Pro",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  /* Trivela DS semantic tokens (Light) */
  --text-primary:#0F172A; --text-white:#FFFFFF; --text-brand-tertiary:#004EB0; --text-error-primary:#DC2626;
  --fg-white:#FFFFFF; --fg-primary:#0F172A; --fg-brand-secondary:#0057C4; --fg-error-secondary:#EF4444;
  --bg-primary:#FFFFFF; --bg-primary-hover:#F8FAFC; --bg-brand-solid:#0057C4; --bg-brand-solid-hover:#004EB0; --bg-brand-primary:#E6EEF9; --bg-brand-primary-hover:#B3CDED;
  --bg-error-solid:#DC2626; --bg-error-solid-hover:#B91C1C; --bg-error-secondary:#FEE2E2; --bg-error-secondary-hover:#FECACA;
  --bg-secondary-brand-solid:#2A9722; --bg-secondary-brand-solid-hover:#24771E; --bg-disabled:#E2E8F0;
  --border-brand:#0057C4; --focus-ring:#0057C4; --focus-ring-error:#EF4444; --focus-gap:#FFFFFF;
  --glass-edge:rgba(230,230,230,.6); --ghost-shadow:0 0 0 1px rgba(0,0,0,.06),0 1px 3px rgba(0,0,0,.08),0 8px 15px rgba(0,0,0,.07);
  --text-secondary:#334155; --text-tertiary:#475569; --text-placeholder:#64748B; --text-brand-tertiary-alt:#004EB0;
  --border-primary:#CBD5E1; --border-secondary:#E2E8F0; --border-error:#EF4444; --border-error-subtle:#FCA5A5; --fg-quaternary:#94A3B8; --utility-neutral-300:#CBD5E1;
  --bg-tag:#FFFFFF; --input-shadow:0 1px 2px rgba(0,0,0,.05); --ck-hover-bg:#E6EEF9; --text-secondary-hover:#1E293B; --text-quaternary:#64748B; --text-brand-secondary:#00469D; --fg-brand-primary:#004EB0; --menu-border:rgba(0,0,0,.1); --menu-shadow:0 2px 2px -1px rgba(0,0,0,.04),0 4px 6px -2px rgba(0,0,0,.03),0 12px 16px -4px rgba(0,0,0,.08);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --page:#020617; --page-2:#0B1222; --ink:#F8FAFC; --ink-2:#CBD5E1; --ink-3:#94A3B8; --line:#1E293B; --line-2:#0F172A;
  --accent:#80ABE2; --accent-ink:#99BCE7; --accent-soft:#0B2547; --code-bg:#0B1222; --stage:#0B1222; --stage-dot:#1E293B;
  --text-primary:#F8FAFC; --text-brand-tertiary:#94A3B8; --text-error-primary:#F87171;
  --fg-primary:#FFFFFF; --fg-brand-secondary:#0057C4; --fg-error-secondary:#F87171;
  --bg-primary:#020617; --bg-primary-hover:#0F172A; --bg-brand-primary:#0057C4; --bg-brand-primary-hover:#1A68CA; --bg-brand-solid-hover:#1A68CA;
  --bg-error-secondary:#DC2626; --bg-error-secondary-hover:#B91C1C; --bg-disabled:#334155;
  --border-brand:#1A68CA; --focus-gap:#020617; --glass-edge:rgba(255,255,255,.12); --ghost-shadow:0 0 0 1px #1E293B;
  --text-secondary:#CBD5E1; --text-tertiary:#94A3B8; --text-placeholder:#64748B; --text-brand-tertiary-alt:#F8FAFC;
  --border-primary:#334155; --border-secondary:#1E293B; --border-error:#F87171; --border-error-subtle:#EF4444; --fg-quaternary:#64748B; --utility-neutral-300:#334155;
  --bg-tag:#0F172A; --input-shadow:none; --ck-hover-bg:#0B2547; --text-secondary-hover:#E2E8F0; --text-quaternary:#94A3B8; --text-brand-secondary:#CBD5E1; --fg-brand-primary:#80ABE2; --menu-border:#1E293B; --menu-shadow:0 12px 24px rgba(0,0,0,.4);
  color-scheme:dark; } }
:root[data-theme="dark"]{
  --page:#020617; --page-2:#0B1222; --ink:#F8FAFC; --ink-2:#CBD5E1; --ink-3:#94A3B8; --line:#1E293B; --line-2:#0F172A;
  --accent:#80ABE2; --accent-ink:#99BCE7; --accent-soft:#0B2547; --code-bg:#0B1222; --stage:#0B1222; --stage-dot:#1E293B;
  --text-primary:#F8FAFC; --text-brand-tertiary:#94A3B8; --text-error-primary:#F87171;
  --fg-primary:#FFFFFF; --fg-brand-secondary:#0057C4; --fg-error-secondary:#F87171;
  --bg-primary:#020617; --bg-primary-hover:#0F172A; --bg-brand-primary:#0057C4; --bg-brand-primary-hover:#1A68CA; --bg-brand-solid-hover:#1A68CA;
  --bg-error-secondary:#DC2626; --bg-error-secondary-hover:#B91C1C; --bg-disabled:#334155;
  --border-brand:#1A68CA; --focus-gap:#020617; --glass-edge:rgba(255,255,255,.12); --ghost-shadow:0 0 0 1px #1E293B;
  --text-secondary:#CBD5E1; --text-tertiary:#94A3B8; --text-placeholder:#64748B; --text-brand-tertiary-alt:#F8FAFC;
  --border-primary:#334155; --border-secondary:#1E293B; --border-error:#F87171; --border-error-subtle:#EF4444; --fg-quaternary:#64748B; --utility-neutral-300:#334155;
  --bg-tag:#0F172A; --input-shadow:none; --ck-hover-bg:#0B2547; --text-secondary-hover:#E2E8F0; --text-quaternary:#94A3B8; --text-brand-secondary:#CBD5E1; --fg-brand-primary:#80ABE2; --menu-border:#1E293B; --menu-shadow:0 12px 24px rgba(0,0,0,.4);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-padding-top:80px}
body{background:var(--page);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--page)}
a{color:inherit}
code,pre,.mono{font-family:var(--mono)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

/* Header */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--page) 88%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.hdr-in{max-width:1440px;margin:0 auto;height:60px;display:flex;align-items:center;gap:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:baseline;gap:8px;text-decoration:none}
.brand b{font-weight:700;font-size:20px;letter-spacing:-.01em;color:var(--accent-ink)}
.brand b i{font-style:normal;color:#2A9722}
.brand span{font-size:12px;font-weight:600;color:var(--ink-3);border:1px solid var(--line);border-radius:9999px;padding:1px 8px;line-height:18px}
.hdr-sp{flex:1}
.hdr a.ext{font-size:14px;font-weight:500;color:var(--ink-2);text-decoration:none}
.hdr a.ext:hover{color:var(--accent-ink)}
.iconbtn{width:36px;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--page);color:var(--ink-2);display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.iconbtn:hover{color:var(--ink);background:var(--page-2)}
.menu-btn{display:none}

/* Shell */
.shell{max-width:1440px;margin:0 auto;display:grid;grid-template-columns:260px minmax(0,1fr) 220px;gap:48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.nav{position:sticky;top:calc(60px + env(safe-area-inset-top,0px));align-self:start;height:calc(100vh - 60px - env(safe-area-inset-top,0px));overflow:auto;padding-block:32px 48px;padding-right:8px}
.nav h5{margin:24px 0 8px;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink)}
.nav h5:first-child{margin-top:0}
.nav ul{list-style:none;margin:0;padding:0 0 0 12px;border-left:1px solid var(--line)}
.nav li a{display:block;margin-left:-13px;padding:5px 0 5px 12px;border-left:1px solid transparent;font-size:14px;color:var(--ink-3);text-decoration:none}
.nav li a:hover{color:var(--ink);border-left-color:var(--ink-3)}
.nav li a[aria-current="page"]{color:var(--accent-ink);border-left-color:var(--accent);font-weight:600}
.nav .soon{display:block;padding:5px 0;font-size:14px;color:var(--ink-3);opacity:.6}
main{min-width:0;padding-block:40px 96px}
.toc{position:sticky;top:calc(60px + env(safe-area-inset-top,0px));align-self:start;padding-block:40px;font-size:13px}
.toc h6{margin:0 0 10px;font-size:12px;font-weight:600;color:var(--ink);letter-spacing:.02em}
.toc a{display:block;padding:4px 0;color:var(--ink-3);text-decoration:none;line-height:1.4}
.toc a:hover{color:var(--ink)}
.toc a.l2{padding-left:12px}

/* Article */
.eyebrow{font-size:14px;font-weight:600;color:var(--accent-ink);margin:0 0 6px}
h1{font-size:32px;line-height:1.2;letter-spacing:-.02em;font-weight:700;margin:0 0 12px;text-wrap:balance}
.lead{font-size:17px;line-height:1.6;color:var(--ink-2);max-width:68ch;margin:0 0 32px}
h2{font-size:22px;line-height:1.3;font-weight:600;letter-spacing:-.01em;margin:56px 0 12px;scroll-margin-top:80px;text-wrap:balance}
h3{font-size:17px;line-height:1.4;font-weight:600;margin:36px 0 8px;scroll-margin-top:80px}
p{max-width:72ch;color:var(--ink-2);margin:0 0 16px}
p code,li code,td code{font-size:.86em;background:var(--page-2);border:1px solid var(--line);border-radius:6px;padding:1px 6px;color:var(--ink)}
ul.plain{padding-left:20px;color:var(--ink-2);max-width:72ch}
ul.plain li{margin:4px 0}
.callout{border:1px solid var(--line);background:var(--page-2);border-radius:12px;padding:14px 16px;font-size:14px;color:var(--ink-2);max-width:72ch;margin:0 0 20px}
.callout b{color:var(--ink)}
.callout.warn{border-color:#FDE047;background:color-mix(in srgb,#FEF9C3 55%,var(--page))}

/* Reference table */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;margin:0 0 24px;max-height:none}
.tbl-wrap.scroll{max-height:420px;overflow-y:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{position:sticky;top:0;background:var(--page);text-align:left;font-weight:600;color:var(--ink);padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 14px;border-bottom:1px solid var(--line-2);vertical-align:top;color:var(--ink-2)}
tr:last-child td{border-bottom:none}
td.k{font-family:var(--mono);font-size:12.5px;color:var(--accent-ink);white-space:nowrap}
td.v{font-family:var(--mono);font-size:12.5px;color:var(--ink-3)}
td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.pass{color:#16A34A;font-weight:600}.fail{color:#DC2626;font-weight:600}

/* Example block */
.ex{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:0 0 28px}
.stage{background-color:var(--stage);background-image:radial-gradient(var(--stage-dot) 1px,transparent 1px);background-size:16px 16px;padding:32px 24px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:center;min-height:120px}
.stage.col{flex-direction:column;align-items:flex-start}
.stage .row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.stage .lbl{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);min-width:76px}
.code{position:relative;background:var(--code-bg);border-top:1px solid var(--line)}
.code pre{margin:0;padding:18px 96px 18px 20px;overflow-x:auto;font-size:13px;line-height:1.7;color:var(--code-ink);tab-size:2}
.code .copy{position:absolute;top:10px;right:10px;font-family:var(--font);font-size:12px;font-weight:600;color:var(--code-dim);background:transparent;border:1px solid #334155;border-radius:6px;padding:3px 10px;cursor:pointer}
.code .copy:hover{color:#fff;border-color:#64748B}
.t-tag{color:var(--code-tag)}.t-attr{color:var(--code-key)}.t-str{color:var(--code-str)}.t-com{color:var(--code-dim)}

/* Playground (Storybook controls) */
.pg{display:grid;grid-template-columns:minmax(0,1fr) 280px;border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:0 0 12px}
.pg .stage{min-height:260px;border-right:1px solid var(--line)}
.controls{padding:16px;display:flex;flex-direction:column;gap:14px;background:var(--page)}
.controls h4{margin:0;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.ctl{display:flex;flex-direction:column;gap:6px}
.ctl label,.ctl .cl{font-size:13px;font-weight:500;color:var(--ink-2)}
.ctl select,.ctl input[type=text]{font:inherit;font-size:14px;height:36px;border:1px solid var(--line);border-radius:8px;padding:0 10px;background:var(--page);color:var(--ink)}
.seg{display:flex;flex-wrap:wrap;gap:4px}
.seg button{font:inherit;font-size:12.5px;font-weight:600;height:30px;padding:0 10px;border-radius:7px;border:1px solid var(--line);background:var(--page);color:var(--ink-2);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink)}
.chk{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2)}
.chk input{width:16px;height:16px;accent-color:var(--accent)}
.pg-code .code{border-top:none;border-radius:12px;border:1px solid var(--line)}
.tabs{display:flex;gap:4px;margin:0 0 8px}
.tabs button{font:inherit;font-size:13px;font-weight:600;padding:6px 12px;border-radius:8px;border:none;background:none;color:var(--ink-3);cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--page-2);color:var(--ink)}

/* Swatches */
.sw-grid{display:grid;grid-template-columns:120px repeat(11,minmax(0,1fr));gap:6px 8px;align-items:center;margin:0 0 24px;overflow-x:auto}
.sw-name{font-size:13px;font-weight:600;color:var(--ink)}
.sw{display:flex;flex-direction:column;gap:4px;min-width:52px}
.sw i{display:block;height:40px;border-radius:8px;box-shadow:inset 0 0 0 1px rgba(15,23,42,.08)}
.sw small{font-family:var(--mono);font-size:10.5px;line-height:1.3;color:var(--ink-3)}
.sw small b{display:block;color:var(--ink-2);font-weight:500}
.type-row{display:grid;grid-template-columns:150px minmax(0,1fr);gap:16px;align-items:baseline;padding:14px 0;border-bottom:1px solid var(--line-2)}
.type-row .meta{font-family:var(--mono);font-size:12px;color:var(--ink-3)}
.type-row .meta b{display:block;font-family:var(--font);font-size:13px;color:var(--ink);font-weight:600}
.type-row .sample{color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.bar{height:16px;background:var(--accent);border-radius:3px;opacity:.85}
.rad{width:72px;height:72px;background:var(--accent-soft);border:2px solid var(--accent)}
.shadow-box{width:100%;height:96px;border-radius:12px;background:var(--bg-primary);display:flex;align-items:flex-end;padding:10px;font-family:var(--mono);font-size:12px;color:var(--ink-3)}
.grid-auto{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:24px;margin:0 0 24px}
.pager{display:flex;justify-content:space-between;gap:16px;margin-top:64px;padding-top:24px;border-top:1px solid var(--line)}
.pager a{text-decoration:none;font-size:14px;color:var(--ink-3)}
.pager a b{display:block;color:var(--ink);font-size:15px}
.pager a:hover b{color:var(--accent-ink)}

/* ===== TriVela Button (implementation under test) ===== */
.tc-btn{--tint:var(--bg-brand-solid);position:relative;display:inline-flex;align-items:center;justify-content:center;font-family:"Be Vietnam Pro",ui-sans-serif,system-ui,sans-serif;font-weight:600;letter-spacing:0;border:0;border-radius:12px;white-space:nowrap;cursor:pointer;transition:background-color .15s ease,box-shadow .15s ease,transform .1s ease;-webkit-tap-highlight-color:transparent}
.tc-btn .lbl-t{padding:0 2px}
.tc-btn svg{flex:none}
.tc-btn--xs{height:32px;padding:6px 10px;gap:4px;font-size:14px;line-height:20px}
.tc-btn--sm{height:36px;padding:8px 12px;gap:4px;font-size:14px;line-height:20px}
.tc-btn--md{height:40px;padding:10px 14px;gap:4px;font-size:14px;line-height:20px}
.tc-btn--lg{height:44px;padding:10px 16px;gap:6px;font-size:16px;line-height:24px}
.tc-btn--xl{height:48px;padding:12px 18px;gap:6px;font-size:16px;line-height:24px}
.tc-btn--icon{border-radius:9999px;padding:0;aspect-ratio:1/1}
.tc-btn--xs.tc-btn--icon{width:32px}.tc-btn--sm.tc-btn--icon{width:36px}.tc-btn--md.tc-btn--icon{width:40px}.tc-btn--lg.tc-btn--icon{width:44px}.tc-btn--xl.tc-btn--icon{width:48px}
.tc-btn--primary{--tint:var(--bg-brand-solid);--tint-h:var(--bg-brand-solid-hover)}
.tc-btn--secondary{--tint:var(--bg-secondary-brand-solid);--tint-h:var(--bg-secondary-brand-solid-hover)}
.tc-btn--error{--tint:var(--bg-error-solid);--tint-h:var(--bg-error-solid-hover)}
.tc-btn--primary,.tc-btn--secondary,.tc-btn--error{background:var(--tint);color:var(--text-white);box-shadow:inset 0 1px 0 rgba(255,255,255,.28),inset 0 -1px 0 rgba(0,0,0,.18),-1px 0 0 -.5px var(--glass-edge),1px 0 0 -.5px var(--glass-edge),0 8px 15px rgba(0,0,0,.02)}
.tc-btn--primary:hover,.tc-btn--secondary:hover,.tc-btn--error:hover{background:var(--tint-h)}
.tc-btn--outline{background:var(--bg-primary);color:var(--text-brand-tertiary);box-shadow:inset 0 0 0 2px var(--border-brand)}
.tc-btn--outline svg{color:var(--fg-brand-secondary)}
.tc-btn--outline:hover{background:var(--bg-primary-hover)}
.tc-btn--tertiary{background:var(--bg-brand-primary);color:var(--text-brand-tertiary)}
.tc-btn--tertiary svg{color:var(--fg-brand-secondary)}
.tc-btn--tertiary:hover{background:var(--bg-brand-primary-hover)}
.tc-btn--ghost{background:var(--bg-primary);color:var(--text-primary);box-shadow:var(--ghost-shadow)}
.tc-btn--ghost svg{opacity:.6}
.tc-btn--ghost:hover{background:var(--bg-primary-hover)}
.tc-btn--error-soft{background:var(--bg-error-secondary);color:var(--text-error-primary)}
.tc-btn--error-soft svg{color:var(--fg-error-secondary)}
.tc-btn--error-soft:hover{background:var(--bg-error-secondary-hover)}
.tc-btn:active:not(:disabled){transform:scale(.98)}
.tc-btn:focus-visible{outline:none;box-shadow:0 0 0 2px var(--focus-gap),0 0 0 4px var(--focus-ring)}
.tc-btn--outline:focus-visible{box-shadow:inset 0 0 0 2px var(--border-brand),0 0 0 2px var(--focus-gap),0 0 0 4px var(--focus-ring)}
.tc-btn--error:focus-visible,.tc-btn--error-soft:focus-visible{box-shadow:0 0 0 2px var(--focus-gap),0 0 0 4px var(--focus-ring-error)}
.tc-btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.tc-btn--primary:disabled,.tc-btn--secondary:disabled,.tc-btn--error:disabled{box-shadow:none;background:var(--tint)}
.tc-btn--primary:disabled svg,.tc-btn--secondary:disabled svg,.tc-btn--error:disabled svg{opacity:.6}
.tc-btn--ghost:disabled{background:var(--bg-disabled);box-shadow:none}
.tc-btn[aria-busy="true"]{cursor:progress}
.tc-spin{animation:tcspin .8s linear infinite}
@keyframes tcspin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.tc-spin{animation-duration:2.4s}.tc-btn{transition:none}.tc-btn:active:not(:disabled){transform:none}}
/* Force-state helpers for docs */
.tc-btn.is-hover.tc-btn--primary,.tc-btn.is-hover.tc-btn--secondary,.tc-btn.is-hover.tc-btn--error{background:var(--tint-h)}
.tc-btn.is-hover.tc-btn--outline,.tc-btn.is-hover.tc-btn--ghost{background:var(--bg-primary-hover)}
.tc-btn.is-hover.tc-btn--tertiary{background:var(--bg-brand-primary-hover)}
.tc-btn.is-hover.tc-btn--error-soft{background:var(--bg-error-secondary-hover)}

function inJsx(o){

});
function openCtx(x,y){var a=$("#ctxArea"),m=$("#ctxMenu");if(!a||!m)return;closeAllDd();m.hidden=false;var r=a.getBoundingClientRect();var mx=Math.min(x-r.left,r.width-m.offsetWidth-4),my=Math.min(y-r.top,r.height-m.offsetHeight-4);m.style.left=Math.max(4,mx)+"px";m.style.top=Math.max(4,my)+"px";var it=ddItems(m);if(it[0])it[0].focus({preventScroll:true})}
document.addEventListener("contextmenu",function(e){var a=e.target.closest("#ctxArea");if(!a||e.target.closest("#ctxMenu"))return;e.preventDefault();openCtx(e.clientX,e.clientY)});
document.addEventListener("keydown",function(e){if(e.target.id==="ctxArea"&&((e.shiftKey&&e.key==="F10")||e.key==="ContextMenu")){e.preventDefault();var r=e.target.getBoundingClientRect();openCtx(r.left+r.width/2-100,r.top+24)}});

/* ---------- Playground ---------- */
var pg={size:"md",hierarchy:"primary",state:"default",iconOnly:false,iconLeading:"plus",iconTrailing:"",label:"Đặt lịch khám",loadingText:"Đang xử lý…",tab:"jsx"};
function seg(name,opts,labels){return'<div class="ctl"><span class="cl">'+name.label+'</span><div class="seg" data-key="'+name.key+'">'+opts.map(function(o){return'<button type="button" data-v="'+o+'" aria-pressed="'+(String(pg[name.key])===String(o))+'">'+(labels?labels[o]:o)+"</button>"}).join("")+"</div></div>"}
function renderControls(){
  var c=$("#pgCtl"); if(!c)return;
  c.innerHTML='<h4>Controls</h4>'+
    seg({key:"size",label:"size"},SIZES)+
    '<div class="ctl"><label for="pg-h">hierarchy</label><select id="pg-h">'+HIER.map(function(h){return'<option value="'+h+'"'+(pg.hierarchy===h?" selected":"")+">"+h+"</option>"}).join("")+"</select></div>"+
    seg({key:"state",label:"state"},["default","disabled","loading"])+
    '<div class="ctl"><label for="pg-l">label</label><input type="text" id="pg-l" value="'+esc(pg.label)+'"></div>'+
    '<div class="ctl"><label for="pg-il">iconLeading</label><select id="pg-il"><option value="">none</option>'+ICON_PICK.map(function(k){return'<option value="'+k+'"'+(pg.iconLeading===k?" selected":"")+">"+k+"</option>"}).join("")+"</select></div>"+
    '<div class="ctl"><label for="pg-it">iconTrailing</label><select id="pg-it"><option value="">none</option>'+ICON_PICK.map(function(k){return'<option value="'+k+'"'+(pg.iconTrailing===k?" selected":"")+">"+k+"</option>"}).join("")+"</select></div>"+
    '<label class="chk"><input type="checkbox" id="pg-io"'+(pg.iconOnly?" checked":"")+"> iconOnly</label>";
  c.querySelectorAll(".seg").forEach(function(s){s.addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;pg[s.dataset.key]=b.dataset.v;renderControls();renderPg()})});
  $("#pg-h").addEventListener("change",function(e){pg.hierarchy=e.target.value;renderPg()});
  $("#pg-l").addEventListener("input",function(e){pg.label=e.target.value;renderPg()});
  $("#pg-il").addEventListener("change",function(e){pg.iconLeading=e.target.value;renderPg()});
  $("#pg-it").addEventListener("change",function(e){pg.iconTrailing=e.target.value;renderPg()});
  $("#pg-io").addEventListener("change",function(e){pg.iconOnly=e.target.checked;renderPg()});
}
function pgOpts(){return{size:pg.size,hierarchy:pg.hierarchy,label:pg.label||"Nút",iconLeading:pg.iconLeading||null,iconTrailing:pg.iconTrailing||null,iconOnly:pg.iconOnly,disabled:pg.state==="disabled",loading:pg.state==="loading",loadingText:pg.loadingText}}
function renderPg(){
  var st=$("#pgStage"); if(!st)return;
  var o=pgOpts();
  st.innerHTML=btn(o);
  var html=btn(o).replace(/<svg[\s\S]*?<\/svg>/g,"<svg …/>");
  var code=pg.tab==="jsx"?jsx(o):html;
  $("#pgCode").innerHTML=codeBlock(code);
  document.querySelectorAll(".pg-code .tabs button").forEach(function(b){b.setAttribute("aria-selected",String(b.dataset.tab===pg.tab))});
}

/* ---------- Router ---------- */
function renderNav(cur){
  $("#nav").innerHTML=NAV.map(function(g){return"<h5>"+g[0]+"</h5><ul>"+g[1].map(function(i){return'<li><a href="#'+i[0]+'"'+(i[0]===cur?' aria-current="page"':"")+">"+i[1]+"</a></li>"}).join("")+""+"</ul>"}).join("");
}
function renderToc(){
  var hs=document.querySelectorAll("#main h2[id], #main h3[id]");
  $("#toc").innerHTML=hs.length?"<h6>Trên trang này</h6>"+Array.prototype.map.call(hs,function(h){return'<a class="'+(h.tagName==="H3"?"l2":"")+'" href="#'+h.id+'" data-jump="'+h.id+'">'+h.textContent+"</a>"}).join(""):"";
}
function pager(cur){
  var i=ORDER.indexOf(cur),p=ORDER[i-1],n=ORDER[i+1];
  return'<nav class="pager" aria-label="Trang">'+(p?'<a href="#'+p+'"><span>Trước</span><b>'+TITLES[p]+"</b></a>":"<span></span>")+(n?'<a href="#'+n+'" style="text-align:right"><span>Tiếp</span><b>'+TITLES[n]+"</b></a>":"<span></span>")+"</nav>";
}
var lastPage=null;
function route(){
  var h=(location.hash||"").slice(1);
  if(h&&!PAGES[h]){ var el=document.getElementById(h); if(el){el.scrollIntoView();return} }
  var page=PAGES[h]?h:"button";
  if(page===lastPage)return;
  lastPage=page;
  $("#main").innerHTML=PAGES[page]()+pager(page);
  renderNav(page); renderToc();
  if(page==="button"){renderControls();renderPg()}
  if(page==="input"){renderInCtl();renderInPg()}
  if(page==="badge"){renderBgCtl();renderBgPg()}
  if(page==="checkbox"){renderCkCtl();renderCkPg();initInd($("#main"))}
  if(page==="dropdown"){renderDdCtl();renderDdPg()}
  window.scrollTo(0,0);
  $("#nav").classList.remove("open"); $("#menuBtn").setAttribute("aria-expanded","false");
}
window.addEventListener("hashchange",route);

/* in-page anchors: scroll without leaving the page */
document.addEventListener("click",function(e){
  var a=e.target.closest("a[data-jump]");
  if(a){e.preventDefault();var t=document.getElementById(a.dataset.jump);if(t)t.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"});return}
  var cp=e.target.closest(".copy");
  if(cp){
    var txt=cp.parentNode.querySelector("pre").innerText;
    var done=function(){cp.textContent="Đã chép";setTimeout(function(){cp.textContent="Sao chép"},1400)};
    try{navigator.clipboard.writeText(txt).then(done,function(){selectPre(cp)})}catch(err){selectPre(cp)}
    return;
  }
  var tb=e.target.closest(".pg-code .tabs button");
  if(tb){pg.tab=tb.dataset.tab;renderPg()}
});
function selectPre(cp){var pre=cp.parentNode.querySelector("pre");var r=document.createRange();r.selectNodeContents(pre);var s=getSelection();s.removeAllRanges();s.addRange(r);cp.textContent="Đã chọn, nhấn Ctrl+C"}

$("#menuBtn").addEventListener("click",function(){var n=$("#nav");var o=n.classList.toggle("open");this.setAttribute("aria-expanded",String(o))});
$("#themeBtn").addEventListener("click",function(){
  var r=document.documentElement;
  var dark=r.getAttribute("data-theme")?r.getAttribute("data-theme")==="dark":matchMedia("(prefers-color-scheme: dark)").matches;
  r.setAttribute("data-theme",dark?"light":"dark");
  try{localStorage.setItem("tv-theme",r.getAttribute("data-theme"))}catch(e){}
});
try{var saved=localStorage.getItem("tv-theme");if(saved)document.documentElement.setAttribute("data-theme",saved)}catch(e){}

route();
})();
</script>
